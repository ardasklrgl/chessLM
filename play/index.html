<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChessGPT · Play</title>
<style>
  * { box-sizing: border-box; }
  :root {
    color-scheme: dark;
    font: 14px/1.45 "Noto Sans", system-ui, sans-serif;
    color: #bababa;
    background: linear-gradient(#2e2a24, #161512 190px) #161512 no-repeat;
    --light: #f0d9b5;
    --dark: #b58863;
    --panel: #262421;
    --line: #393631;
    --muted: #aaa69f;
    --accent: #8ab7e8;
  }
  body { margin: 0; }
  main { max-width: 1176px; margin: auto; padding: 0 20px 24px; }
  header {
    min-height: 58px; padding: 10px 0; margin-bottom: 13px;
    border-bottom: 1px solid var(--line); display: flex;
    flex-wrap: wrap; align-items: baseline; gap: 4px 22px;
  }
  h1 { color: #e4e2df; font-size: 26px; letter-spacing: -.7px; font-weight: 500; margin: 0; }
  h2 { color: #d3d0ca; margin: 0 0 8px; font-size: 14px; font-weight: 600; }
  .meta, .hint { color: var(--muted); font-size: 13px; }
  .meta { overflow-wrap: anywhere; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(246px, 310px); gap: 12px; align-items: stretch; }
  #board {
    display: grid; grid-template-columns: repeat(8, minmax(0, 1fr));
    grid-template-rows: repeat(8, minmax(0, 1fr));
    container-type: inline-size; align-self: start;
    aspect-ratio: 1; overflow: hidden; box-shadow: 0 2px 10px #0005;
  }
  button, select { font: inherit; color: #d2cfca; background: #302d29; border: 1px solid #45413b; border-radius: 3px; padding: 5px 9px; }
  button:not(:disabled), select:not(:disabled) { cursor: pointer; }
  button:enabled:hover { background: #3c3833; }
  button:disabled { opacity: .42; }
  .square { position: relative; display: grid; place-items: center; min-width: 0; min-height: 0; padding: 0; border: 0; border-radius: 0; line-height: 1; }
  .square:disabled { opacity: 1; }
  .square.light { background: var(--light); color: var(--dark); }
  .square.dark { background: var(--dark); color: var(--light); }
  .last { box-shadow: inset 0 0 0 100px #9fbc31aa; }
  .selected { box-shadow: inset 0 0 0 100px #93ad30aa; }
  .target::after { content: ""; position: absolute; border-radius: 50%; width: 24%; height: 24%; background: #18251e45; pointer-events: none; }
  .occupied.target::after { background: none; width: 91%; height: 91%; border: 4px solid #18251e55; }
  .square.illegal { background: #b34343; color: #fff3ea; box-shadow: inset 0 0 0 3px #f68b89; }
  .square:focus-visible { outline: 3px solid #2474bd; outline-offset: -3px; z-index: 1; }
  .piece {
    font: 9.8cqw/1 "DejaVu Sans", "Apple Symbols", "Segoe UI Symbol", serif;
    text-shadow: 0 1px 1px #0007; transform: translateY(-.04em);
  }
  .white-piece { color: #fffefa; -webkit-text-stroke: 1px #262320; paint-order: stroke fill; }
  .black-piece { color: #272421; -webkit-text-stroke: .4px #080808; }
  .coord { position: absolute; font: 700 clamp(9px, 1.7cqw, 14px)/1 system-ui; pointer-events: none; }
  .file { right: 4px; bottom: 3px; }
  .rank { left: 4px; top: 3px; }
  aside {
    display: flex; flex-direction: column; min-width: 0; min-height: 0;
    background: var(--panel); border: 1px solid var(--line); box-shadow: 0 2px 10px #0003;
  }
  .panel { padding: 12px; }
  .panel + .panel { border-top: 1px solid var(--line); }
  .status { background: #2d2925; }
  .controls { display: flex; gap: 5px; flex-wrap: wrap; }
  button.primary { background: #2766a1; color: #fff; border-color: #3d7cb8; }
  button.primary:enabled:hover { background: #327ab9; }
  #turn, #message, .hint { margin: 0; }
  #turn { color: #e4e2df; font-weight: 600; }
  #message { margin: 4px 0 8px; min-height: 20px; overflow-wrap: anywhere; }
  #message.error { color: #ffa2a1; }
  label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  label:last-child { margin-bottom: 0; }
  .moves { flex: 1; display: flex; min-height: 110px; flex-direction: column; }
  #history { margin: 0; overflow: auto; max-height: clamp(110px, calc(65vw - 250px), 510px); padding: 0; list-style: none; counter-reset: moves; font-variant-numeric: tabular-nums; }
  #history li { display: grid; grid-template-columns: 32px 1fr 1fr; align-items: center; min-height: 27px; counter-increment: moves; }
  #history li:nth-child(odd) { background: #302d28; }
  #history li::before { content: counter(moves) "."; padding-left: 7px; color: var(--muted); }
  #history li span { padding: 2px 5px; }
  #history li:last-child span:last-child { color: var(--accent); font-weight: 600; }
  #picks { list-style: none; margin: 0 0 7px; padding: 0; }
  #picks li { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 3px 6px; font-variant-numeric: tabular-nums; }
  #picks li:nth-child(odd) { background: #302d28; }
  #picks li.chosen { font-weight: 700; color: var(--accent); }
  #picks li.rejected { color: #ffa2a1; }
  [hidden] { display: none !important; }
  @media (max-width: 700px) {
    main { padding: 0 10px 16px; }
    header { margin-bottom: 9px; min-height: 48px; }
    .layout { grid-template-columns: minmax(0, 1fr); }
    #history { max-height: 210px; }
  }
</style>
</head>
<body>
<main>
  <header><h1>ChessGPT</h1><span class="meta" id="model">Loading checkpoint…</span></header>
  <div class="layout">
    <section id="board" aria-label="Chessboard"></section>
    <aside>
      <section class="panel status">
        <div aria-live="polite"><p id="turn"></p><p id="message">Connecting to the local model…</p></div>
        <div class="controls">
          <button id="retry" class="primary" hidden>Retry AI move</button>
          <button id="undo" disabled>Undo</button>
          <button id="reset" disabled>New game</button>
        </div>
      </section>
      <section class="panel">
        <label for="side">Play as
          <select id="side" disabled><option value="w">White</option><option value="b">Black</option></select>
        </label>
        <label for="mode">AI move mode
          <select id="mode"><option value="free">Free generation</option><option value="legal">Legal moves only</option></select>
        </label>
        <label for="temperature">AI temperature
          <select id="temperature">
            <option value="0">0 · Top choice</option><option value="0.3">0.3</option>
            <option value="0.5">0.5</option><option value="0.8" selected>0.8</option>
            <option value="1">1.0</option><option value="1.3">1.3</option><option value="2">2.0</option>
          </select>
        </label>
        <label id="promotion-label" for="promotion" hidden>Promote to
          <select id="promotion" aria-label="Promotion piece">
            <option value="">Choose…</option><option value="q">Queen</option><option value="r">Rook</option>
            <option value="b">Bishop</option><option value="n">Knight</option>
          </select>
        </label>
      </section>
      <section class="panel" id="prediction-panel" hidden>
        <h2 id="prediction-title"></h2>
        <ol id="picks"></ol>
        <p class="hint" id="illegal-mass"></p>
      </section>
      <section class="panel moves">
        <h2>Moves</h2><p class="hint" id="empty">Click a piece, then its destination.</p><ol id="history"></ol>
      </section>
    </aside>
  </div>
</main>
<script>
  const $ = id => document.getElementById(id);
  const files = "abcdefgh";
  const symbols = { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" };
  const names = { k: "king", q: "queen", r: "rook", b: "bishop", n: "knight", p: "pawn" };
  let initial, position, context, history = [], selected = "", pendingPromotion = "";
  let rejected = null, prediction = null, busy = false, problem = "", note = "";
  const percent = new Intl.NumberFormat(undefined, {style: "percent", maximumFractionDigits: 1});
  const restartMessage = "Restart the ChessGPT Python server to enable legal-only play.";

  async function request(endpoint, body) {
    const options = body ? { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) } : {};
    const response = await fetch("/api/" + endpoint, options);
    const data = await response.json();
    if (!response.ok) throw new Error(data.error);
    return data;
  }

  function moveList() { return history.map(entry => entry.uci); }
  function turn() { return position.fen.split(" ")[1]; }
  function humanTurn() { return turn() === $("side").value; }
  function atLimit() { return history.length >= context; }

  function render() {
    if (!position) return;
    const orientation = $("side").value;
    const board = position.fen.split(" ")[0].replace(/[1-8]/g, n => ".".repeat(Number(n))).replaceAll("/", "");
    const lastMove = history.at(-1)?.uci;
    const squares = [];
    for (let row = 0; row < 8; row++) {
      for (let col = 0; col < 8; col++) {
        const r = orientation === "w" ? row : 7 - row;
        const c = orientation === "w" ? col : 7 - col;
        const coordinate = files[c] + (8 - r);
        const piece = board[r * 8 + c];
        const isWhite = piece === piece.toUpperCase();
        const kind = piece.toLowerCase();
        const square = document.createElement("button");
        square.className = "square " + ((row + col) % 2 ? "dark" : "light");
        square.setAttribute("aria-label", coordinate + (piece === "." ? "" : " " + (isWhite ? "white " : "black ") + names[kind]));
        square.disabled = busy || !!rejected || !humanTurn() || !!position.outcome || atLimit();
        if (lastMove && [lastMove.slice(0, 2), lastMove.slice(2, 4)].includes(coordinate)) square.classList.add("last");
        if (selected === coordinate) square.classList.add("selected");
        if (selected && position.legalMoves.some(move => move.startsWith(selected + coordinate))) square.classList.add("target");
        if (rejected && [rejected.attempt.slice(0, 2), rejected.attempt.slice(2, 4)].includes(coordinate)) square.classList.add("illegal");
        if (piece !== ".") {
          square.classList.add("occupied");
          square.innerHTML = '<span aria-hidden="true" class="piece ' + (isWhite ? "white-piece" : "black-piece") + '">' + symbols[kind] + "</span>";
        }
        if (row === 7) square.insertAdjacentHTML("beforeend", '<span aria-hidden="true" class="coord file">' + coordinate[0] + "</span>");
        if (col === 0) square.insertAdjacentHTML("beforeend", '<span aria-hidden="true" class="coord rank">' + coordinate[1] + "</span>");
        square.addEventListener("click", () => selectSquare(coordinate));
        squares.push(square);
      }
    }
    $("board").replaceChildren(...squares);
    $("turn").textContent = position.outcome ? "Game over · " + position.outcome :
      atLimit() ? "Model context limit reached" : (turn() === "w" ? "White" : "Black") + " to move · " + (humanTurn() ? "You" : "AI");
    const greedy = Number($("temperature").value) === 0 && $("mode").value === "free";
    const message = problem || (rejected ? "Illegal: " + rejected.attempt + ". " + rejected.reason +
      (greedy ? " Raise temperature to sample a different move." : "") :
      busy && !humanTurn() ? "AI is thinking…" : note);
    $("message").textContent = message;
    $("message").classList.toggle("error", !!(problem || rejected));
    $("retry").hidden = humanTurn() || !!position.outcome || atLimit();
    $("retry").disabled = busy;
    $("undo").disabled = busy || (!rejected && !history.length);
    $("undo").textContent = rejected ? "Revert attempt" : "Undo";
    $("reset").disabled = busy;
    $("side").disabled = busy;
    $("mode").disabled = busy;
    $("temperature").disabled = busy;
    $("promotion-label").hidden = !pendingPromotion;
    $("empty").hidden = !!history.length;
    const rows = [];
    for (let i = 0; i < history.length; i += 2) {
      const row = document.createElement("li");
      for (const entry of history.slice(i, i + 2)) {
        const cell = document.createElement("span");
        cell.textContent = entry.label;
        row.append(cell);
      }
      rows.push(row);
    }
    $("history").replaceChildren(...rows);
    $("history").scrollTop = $("history").scrollHeight;
    renderPrediction();
  }

  function renderPrediction() {
    $("prediction-panel").hidden = !prediction;
    if (!prediction) return;
    const scope = prediction.mode === "legal" ? "legal" : "raw";
    $("prediction-title").textContent = "Last AI turn · top " + scope + " picks";
    const rows = prediction.picks.map(pick => {
      const row = document.createElement("li");
      row.classList.toggle("chosen", pick.selected);
      row.classList.toggle("rejected", !pick.legal);
      const label = document.createElement("span");
      label.textContent = pick.token + (pick.legal ? "" : " · illegal") + (pick.selected ? " · picked" : "");
      const score = document.createElement("span");
      score.textContent = percent.format(pick.probability);
      row.append(label, score);
      return row;
    });
    $("picks").replaceChildren(...rows);
    const temperature = prediction.temperature || 1;
    $("illegal-mass").textContent = "Raw illegal probability " + percent.format(prediction.illegalMass) +
      " · T=" + temperature + (prediction.temperature === 0 ? " for displayed scores" : "");
  }

  async function aiMove() {
    if (busy || humanTurn() || position.outcome || atLimit()) return;
    rejected = null;
    prediction = null;
    problem = "";
    busy = true;
    render();
    try {
      const mode = $("mode").value;
      const result = await request("attempt", {
        history: moveList(),
        temperature: Number($("temperature").value),
        mode,
      });
      if (mode === "legal" && (result.prediction?.mode !== "legal" || !result.legal)) {
        throw new Error(restartMessage);
      }
      prediction = result.prediction;
      if (result.legal) {
        history.push({uci: result.attempt, label: result.san});
        position = result;
        note = "AI played " + result.san + " (" + result.attempt + ").";
      } else {
        rejected = result;
      }
    } catch (error) {
      problem = error.message;
    } finally {
      busy = false;
      render();
    }
  }

  function selectSquare(square) {
    if (selected === square) {
      selected = "";
      pendingPromotion = "";
      render();
      return;
    }
    const matches = selected ? position.legalMoves.filter(move => move.startsWith(selected + square)) : [];
    if (matches.length > 1) {
      pendingPromotion = selected + square;
      $("promotion").value = "";
      render();
      $("promotion").focus();
    } else if (matches.length === 1) {
      playMove(matches[0]);
    } else {
      selected = position.legalMoves.some(move => move.startsWith(square)) ? square : "";
      pendingPromotion = "";
      render();
      const button = [...$("board").children].find(element => element.getAttribute("aria-label").startsWith(square));
      button.focus();
    }
  }

  async function playMove(move) {
    busy = true;
    selected = pendingPromotion = problem = "";
    render();
    try {
      const result = await request("position", {history: [...moveList(), move]});
      history.push({uci: move, label: result.san});
      position = result;
      note = "";
    } catch (error) {
      problem = error.message;
    } finally {
      busy = false;
      render();
    }
    if (!problem) await aiMove();
  }

  function newGame() {
    history = [];
    position = initial;
    selected = pendingPromotion = note = problem = "";
    rejected = null;
    prediction = null;
    render();
    aiMove();
  }

  $("retry").addEventListener("click", aiMove);
  $("reset").addEventListener("click", newGame);
  $("side").addEventListener("change", newGame);
  $("mode").addEventListener("change", render);
  $("temperature").addEventListener("change", render);
  $("promotion").addEventListener("change", event => {
    if (pendingPromotion && event.target.value) playMove(pendingPromotion + event.target.value);
  });
  $("undo").addEventListener("click", async () => {
    if (rejected) {
      rejected = null;
      prediction = null;
      note = "Attempt reverted. Retry from this position.";
      render();
      return;
    }
    const count = humanTurn() && history.length > 1 ? 2 : 1;
    const previous = history.slice(0, -count);
    busy = true;
    render();
    try {
      position = await request("position", {history: previous.map(entry => entry.uci)});
      history = previous;
      prediction = null;
      selected = pendingPromotion = "";
      note = humanTurn() ? "Move undone." : "You can retry the AI from this position.";
      problem = "";
    } catch (error) {
      problem = error.message;
    } finally {
      busy = false;
      render();
    }
  });

  request("model").then(data => {
    initial = position = data;
    context = data.context;
    $("model").textContent = data.name + (data.step == null ? "" : " · step " + data.step.toLocaleString());
    render();
  }).catch(error => { $("message").textContent = error.message; });
</script>
</body>
</html>
